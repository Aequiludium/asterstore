version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      # init and analyze share configuration and must use the same version.
      codeql:
        patterns: ["github/codeql-action/*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["github/codeql-action/*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
