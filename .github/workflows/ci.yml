name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POLARS_MAX_THREADS: "4"

jobs:
  quality:
    name: Quality and protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra polars
      - run: uv run --locked --extra polars ruff check .
      - run: uv run --locked --extra polars ruff format --check .
      - run: uv run --locked --extra polars mypy
      - run: uv run --locked --extra polars python tools/check_protocol.py

  polars-compatibility:
    name: Polars ${{ matrix.polars }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        polars: ["1.32.0", "1.44.2", "2.0.0"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra polars
      - name: Select compatibility version without rewriting the lockfile
        run: uv pip install "polars==${{ matrix.polars }}"
      - run: uv run --no-sync pytest tests/test_polars.py tests/test_transactions.py
      - run: uv run --no-sync python examples/parquet.py

  tests:
    needs: polars-compatibility
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra polars
      - run: uv run --locked --extra polars pytest --junitxml=dist/test-results.xml
      - name: Independent examples
        run: |
          for example in examples/*.py; do
            uv run --locked --extra polars python "$example"
          done
      - name: Scale smoke checks
        run: |
          uv run --locked --extra polars python benchmarks/partition_scale.py --members 100 1000
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-python-${{ matrix.python }}
          path: dist/test-results.xml
          retention-days: 14
          if-no-files-found: warn

  distribution:
    name: Distribution (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra polars
      - run: uv run --locked --extra polars python tools/check_distribution.py --polars --output-dir dist/verified
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-distributions-python-${{ matrix.python }}-${{ github.sha }}
          path: dist/verified/
          retention-days: 30
          if-no-files-found: error

  release-artifacts:
    name: Release artifact verification
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-distributions-python-3.12-${{ github.sha }}
          path: verified
      - name: Verify downloaded release filenames, version, coverage and hashes
        run: python tools/select_release_artifacts.py verified upload

  required:
    name: CI gate
    if: always()
    needs: [quality, tests, distribution, release-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required jobs did not succeed: {failed}")
          print("All required jobs passed")
          PY
