name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra polars
      - run: uv run --locked --extra polars ruff check .
      - run: uv run --locked --extra polars ruff format --check .
      - run: uv run --locked --extra polars mypy
      - run: uv run --locked --extra polars pytest
      - run: uv run --locked --extra polars python examples/binding.py
      - run: uv run --locked --extra polars python examples/declarations.py
      - run: uv run --locked --extra polars python examples/registration.py
      - run: uv run --locked --extra polars python examples/managed_declarations.py
      - run: uv run --locked --extra polars python examples/governance_v4.py
      - run: uv run --locked --extra polars python examples/cleanup_v4.py
      - run: uv run --locked --extra polars python examples/publication.py
      - run: uv run --locked --extra polars python examples/retention.py
      - run: uv run --locked --extra polars python examples/reuse.py
      - run: uv run --locked --extra polars python examples/collection.py
      - run: uv run --locked --extra polars python examples/candidate_cleanup.py
      - run: uv run --locked --extra polars python examples/parquet.py
      - run: uv run --locked --extra polars python benchmarks/parquet_read.py --files 1 4 --rows 16 --repeats 2 --selections 10
      - run: uv run --locked python benchmarks/managed_membership.py --members 128 1024
      - run: uv run --locked python benchmarks/governance_scale.py --history 1 3 --datasets 2 --references 0 2 --logs 0 2 --repeats 1
      - run: uv run --locked --extra polars python tools/check_distribution.py --polars
