name: Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified distributions to PyPI (false rehearses the full pipeline)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  artifacts:
    name: Select and verify release artifacts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-distributions-python-3.12-${{ github.sha }}
          path: verified
      - name: Verify filenames, version and hashes before selecting upload files
        run: python tools/select_release_artifacts.py verified upload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions-${{ github.sha }}
          path: upload/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Upload to PyPI
    if: inputs.publish
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/asterstore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions-${{ github.sha }}
          path: dist
      - name: Publish the same distributions that passed isolated installation checks
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
